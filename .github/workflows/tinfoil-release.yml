# Standard Tinfoil two-phase release. Builds a distinct derivative image,
# pins its real digest in an immutable config tag, then dispatches measurement.
name: Tinfoil Release

run-name: Release ${{ inputs.version }}+b300

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version without build metadata (e.g. v0.1.0-rc.1)'
        required: true
        type: string

concurrency:
  group: tinfoil-container-release-${{ inputs.version }}+b300

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release-tag: ${{ steps.release.outputs.release-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Select and validate release
        id: release
        env:
          VERSION: ${{ inputs.version }}
          SEMVER_VERSION: '7.7.3'
          MAX_IMAGE_TAG_LENGTH: '128'
        run: |
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo "::error::Start releases from a source branch, not a generated release tag"
            exit 1
          fi
          NORMALIZED=$(npm exec --yes --package="semver@$SEMVER_VERSION" -- semver "$VERSION")
          if [[ "$VERSION" != "v$NORMALIZED" || "$VERSION" == *+* ]]; then
            echo "::error::Use a canonical v-prefixed version without build metadata"
            exit 1
          fi
          RELEASE_TAG="$VERSION+b300"
          IMAGE_TAG="${VERSION#v}-b300"
          if (( ${#IMAGE_TAG} > MAX_IMAGE_TAG_LENGTH )); then
            echo "::error::Container image tag is too long"
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          else
            STATUS=$?
            if [[ "$STATUS" != 2 ]]; then exit "$STATUS"; fi
          fi
          {
            echo "release-tag=$RELEASE_TAG"
            echo "image-tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Test bounded model identity patch
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.image-tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.release-tag }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  prepare-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout source commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned configuration updater
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: tinfoilsh/update-container-action
          ref: 5e0a3789316941664cee055706799114e0180565 # v0.6.0
          path: .release-tools
          persist-credentials: false

      - name: Pin image and create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.release-tag }}
          IMAGE_REFS: |
            ghcr.io/mapleprivacylabs/inference-deepseek-uncensored@${{ needs.build.outputs.digest }}
        run: |
          python3 .release-tools/update_config.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE_DATE=$(git show -s --format=%cI "$GITHUB_SHA")
          export GIT_AUTHOR_DATE="$SOURCE_DATE" GIT_COMMITTER_DATE="$SOURCE_DATE"
          git add tinfoil-config.yml
          git commit -m "chore: prepare $VERSION release"
          git tag "$VERSION"
          gh auth setup-git
          git push origin "refs/tags/$VERSION"

      - name: Dispatch publish workflow on new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.release-tag }}
        run: gh workflow run tinfoil-release-publish.yml --ref "$VERSION"
