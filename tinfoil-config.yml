# The source branch uses :build-required; release tags replace it with a real digest.
# Deploy only the digest-pinned configuration from an attested release tag.
cvm-version: 0.14.13
cpus: 56
memory: 786432
gpus: 4

models:
  - name: "deepseek-v4-1-flash-1017-uncensored"
    repo: "dealignai/DeepSeek-V4.1-Flash-1017-UNCENSORED-FP8@c19ca5ca4eaeb79d29fdf08aea8327da95b1116a"
    mpk: "b4afadcff93f3790600e196b1565a0bde218f51e34d7a064c064a7bfd87ca8bf_510311079936_465b2aa3-0cd6-5cdf-8bde-96af5a81b05a"
    schema: 2

containers:
  - name: "deepseek-v4-1-flash-1017-uncensored"
    image: "ghcr.io/mapleprivacylabs/inference-deepseek-uncensored:build-required" # source template; release workflow pins a real digest
    runtime: nvidia
    gpus: all
    restart: always
    secrets:
      - VLLM_API_KEY
      - METRICS_API_KEY
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:False"
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      - VLLM_ALLREDUCE_USE_FLASHINFER: "0"
      - VLLM_DISABLE_UVA: "1"
      - VLLM_TINFOIL_CC_OPTIMIZATIONS: "1"
      - VLLM_TINFOIL_DEEPSEEK_TARGET_TACTIC: "1"
      - FLASHINFER_NO_DOWNLOAD: "1"
      - FLASHINFER_AUTOTUNE_TIMER: "cuda_event"
      - VLLM_CACHE_ROOT: "/root/.cache/vllm"
      - TORCH_EXTENSIONS_DIR: "/root/.cache/deepseek-stock-torch-extensions"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
      - VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-b4afadcff93f3790600e196b1565a0bde218f51e34d7a064c064a7bfd87ca8bf",
        "--tokenizer-mode",
        "deepseek_v41",
        "--tensor-parallel-size",
        "4",
        "--attention-backend",
        "FLASHMLA_SPARSE_DSV41",
        "--kv-cache-dtype",
        "fp8_ds_mla",
        "--mm-encoder-tp-mode",
        "data",
        "--engram-config",
        '{"cpu_offload":false}',
        "--tool-call-parser",
        "deepseek_v41",
        "--enable-auto-tool-choice",
        "--reasoning-parser",
        "deepseek_v41",
        "--enable-force-include-usage",
        "--enable-prompt-tokens-details",
        "--served-model-name",
        "deepseek-v4-1-flash-1017-uncensored",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--disable-custom-all-reduce",
        "--compilation-config",
        '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY","pass_config":{"fuse_allreduce_rms":false}}',
        "--max-model-len",
        "1048576",
        "--max-num-seqs",
        "64",
        "--speculative-config",
        '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}',
        "--override-generation-config",
        '{"temperature":1.0,"top_p":1.0}',
      ]
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8001
  authenticated: false
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /health
